<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RI-STUDIO | ADAPTIVE LAYOUT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>
    <style>
        :root { --main-color: #ffaa00; --trans-time: 1.2s; }
        * { box-sizing: border-box; }
        body { 
            background: #080808; 
            color: white; 
            font-family: sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: flex-start; 
            min-height: 100vh; 
            overflow-y: auto; 
            padding: 15px 10px;
        }

        .app-container {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 720px;
        }

        @media (max-width: 680px) {
            .app-container {
                flex-direction: column;
                align-items: center;
                max-width: 340px;
            }
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        #phone-container {
            position: relative;
            width: 300px; 
            height: 533px; 
            background: #000; 
            border: 2px solid #333; 
            overflow: hidden; 
            flex-shrink: 0;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.9);
        }

        #viewport { position: relative; width: 100%; height: 100%; background: #000; overflow: hidden; }

        /* FUNDALURI */
        #bg-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; z-index: 1; }
        .slide-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity var(--trans-time) ease-in-out; transform: scale(1.1); z-index: 2; }
        .slide-active { opacity: 1; animation: kenBurnsEffect 12s infinite alternate ease-in-out; }
        @keyframes kenBurnsEffect { from { transform: scale(1); } to { transform: scale(1.18); } }

        /* ELEMENTE INTERACTIVE */
        #webcam-layer { position: absolute; width: 130px; height: 100px; z-index: 20; cursor: grab; touch-action: none; }
        #ai-canvas { width: 100%; height: 100%; object-fit: cover; }
        #circle-group { position: absolute; width: 180px; height: 180px; z-index: 15; cursor: grab; touch-action: none; display: flex; align-items: center; justify-content: center; }
        #inner-circle { width: 100px; height: 100px; border: 3px solid var(--main-color); border-radius: 50%; z-index: 16; background: rgba(0,0,0,0.4); overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #draggable-text { position: absolute; z-index: 30; cursor: grab; touch-action: none; font-weight: 900; color: white; text-shadow: 2px 2px 8px #000; white-space: nowrap; padding: 5px; }

        /* HIDE CONTROLS */
        .hide-controls {
            display: flex;
            gap: 6px;
            width: 300px;
            justify-content: space-between;
        }
        .hide-btn {
            flex: 1;
            background: #222;
            border: 1px solid #444;
            color: #aaa;
            font-size: 8px;
            padding: 6px 2px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
        }
        .hide-btn.hidden-state {
            background: #7f1d1d;
            color: #fca5a5;
            border-style: dashed;
        }

        /* UI PANEL */
        .ui-panel { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            width: 320px; 
            background: #111; 
            padding: 12px; 
            border: 1px solid #333; 
            border-radius: 8px; 
            max-height: 560px;
            overflow-y: auto;
        }
        .cube { background: #1a1a1a; padding: 10px; border: 1px solid #333; border-radius: 4px; }
        h4 { font-size: 10px; color: var(--main-color); text-transform: uppercase; margin-bottom: 6px; font-weight: bold; border-bottom: 1px solid #222; padding-bottom: 3px; }
        button { width: 100%; background: #333; color: white; padding: 8px; font-size: 11px; font-weight: bold; margin-bottom: 4px; border-radius: 4px; cursor: pointer; border: none; }
        button.active { background: #059669 !important; }
        button.recording { background: #dc2626 !important; animation: pulseRec 1.5s infinite; }
        @keyframes pulseRec { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        input[type="range"] { width: 100%; accent-color: var(--main-color); cursor: pointer; margin-top: 4px; }
        .label-row { display: flex; justify-content: space-between; font-size: 10px; color: #888; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Coloana Stânga: Ecran Telefon + Butoane Hide -->
        <div class="left-column">
            <div id="phone-container">
                <div id="viewport">
                    <video id="bg-video" loop playsinline muted></video>
                    <div id="slide-container">
                        <img id="slide-1" class="slide-layer">
                        <img id="slide-2" class="slide-layer">
                    </div>
                    <div id="webcam-layer" style="top:20px; left:20px; display:none;"><canvas id="ai-canvas"></canvas></div>
                    <div id="circle-group" style="top:110px; left:50px;">
                        <div id="inner-circle"><img id="inner-img" style="width:100%; height:100%; object-fit:cover; display:none; border-radius: 50%;"></div>
                    </div>
                    <div id="draggable-text" style="bottom:50px; left:30px;">WWW.RIBUILDING.RO</div>
                </div>
            </div>

            <div class="hide-controls">
                <button id="btn-hide-cam" class="hide-btn" onclick="toggleElement('webcam-layer', 'btn-hide-cam', 'CAMĂ')">HIDE CAM: OFF</button>
                <button id="btn-hide-logo" class="hide-btn" onclick="toggleElement('circle-group', 'btn-hide-logo', 'LOGO')">HIDE LOGO: OFF</button>
                <button id="btn-hide-text" class="hide-btn" onclick="toggleElement('draggable-text', 'btn-hide-text', 'TEXT')">HIDE TEXT: OFF</button>
            </div>
        </div>

        <!-- Coloana Dreapta: Panoul de Control -->
        <div class="ui-panel">
            <div class="cube" style="border-color: #dc2626;">
                <h4>5. ÎNREGISTRARE VIDEO (REC)</h4>
                <button id="btn-rec" onclick="toggleRecording()">🔴 START RECORD</button>
                <div class="label-row"><span>STATUS:</span><span id="rec-status">INACTIV</span></div>
            </div>

            <div class="cube">
                <h4>1. VIDEO FUNDAL</h4>
                <button onclick="document.getElementById('file-video').click()">ÎNCARCĂ VIDEO</button>
                <input type="file" id="file-video" accept="video/*" style="display:none" onchange="loadVideo(this)">
                <button id="btn-vid-toggle" onclick="toggleVideo()">VIDEO: OFF</button>
                <button id="btn-vid-mute" onclick="toggleMute()">🔇 MUTE</button>
                <!-- Timer sub video -->
                <div class="label-row" style="margin-top: 6px;"><span>TIMP VIDEO:</span><span id="video-timer">00:00 / 00:00</span></div>
            </div>

            <div class="cube">
                <h4>2. SLIDESHOW POZE</h4>
                <button onclick="document.getElementById('file-slides').click()">UPLOAD POZE</button>
                <input type="file" id="file-slides" multiple accept="image/*" style="display:none" onchange="loadSlides(this)">
                <div class="label-row"><span>TIMP POZĂ:</span><span id="val-slide">4</span>s</div>
                <input type="range" id="range-slide" min="1" max="15" value="4" oninput="updateSlideTime(this.value)">
                <button id="btn-slide" onclick="toggleSlideshow()">START SLIDESHOW</button>
            </div>

            <div class="cube">
                <h4>3. CAMERĂ & LOGO</h4>
                <button onclick="initCam()">START CAMERA</button>
                <button id="btn-ai" onclick="toggleAI()">AI CUT: OFF</button>
                <div class="label-row"><span>MĂRIME CAMERĂ (SCALARE):</span></div>
                <input type="range" id="range-cam-scale" min="0.5" max="3" step="0.1" value="1" oninput="setCamScale(this.value)">
                
                <div style="margin-top: 8px;">
                    <button onclick="document.getElementById('file-inner').click()">UPLOAD LOGO (PNG/JPG)</button>
                    <input type="file" id="file-inner" accept="image/png, image/jpeg" style="display:none" onchange="loadInnerImage(this)">
                </div>
                <button id="btn-logo-vis" onclick="toggleLogoVisibility()" style="background: #059669;">LOGO VIZIBIL: ON</button>
                
                <div class="label-row"><span>MĂRIME LOGO (SCALARE):</span></div>
                <input type="range" id="range-logo-scale" min="0.3" max="3" step="0.1" value="1" oninput="setLogoScale(this.value)">
            </div>

            <div class="cube">
                <h4>4. TEXT BRANDING & MICROFON</h4>
                <input type="text" id="input-text-val" class="w-full bg-black border border-gray-700 p-2 text-[11px] rounded text-white" placeholder="Site..." oninput="updateTextContent(this.value)">
                <div class="label-row"><span>MĂRIME TEXT:</span></div>
                <input type="range" id="range-text-scale" min="0.5" max="4" step="0.1" value="1" oninput="setTextScale(this.value)">
                <div class="label-row"><span>CULOARE TEXT:</span></div>
                <input type="color" id="input-text-color" value="#ffffff" class="w-full h-7 mt-1 border-none cursor-pointer rounded bg-transparent" oninput="setTextColor(this.value)">
                
                <!-- Buton Sursă Microfon ON / OFF -->
                <div style="margin-top: 8px;">
                    <button id="btn-mic-toggle" onclick="toggleMicSource()" style="background: #059669;">MICROFON: ON</button>
                </div>
            </div>
            
            <button onclick="resetAll()" class="bg-red-900 text-[10px] opacity-80 py-2">RESET TOT</button>
        </div>
    </div>

    <video id="hidden-video" style="display:none" autoplay muted playsinline></video>

<script>
    let state = { 
        isAI: false, 
        isSlideshowActive: false, 
        isVideoActive: false, 
        slideTime: 4, 
        isLogoVisible: true, 
        camScale: 1, 
        logoScale: 1,
        textScale: 1,
        textColor: '#ffffff',
        textContent: 'WWW.RIBUILDING.RO',
        isMicActive: true,
        positions: {
            'webcam-layer': {top: '20px', left: '20px'},
            'circle-group': {top: '110px', left: '50px'},
            'draggable-text': {bottom: '50px', left: '30px', top: 'auto'}
        }
    };
    let slideshow = { files: [], idx: 0, int: null, currentLayer: 1 };
    let ai = { selfie: null, stream: null };

    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;
    let recordCanvas, recordCtx, recordInterval;

    // Formatare timp pentru timer (secunde -> mm:ss)
    function formatTime(seconds) {
        if (isNaN(seconds)) return "00:00";
        let m = Math.floor(seconds / 60);
        let s = Math.floor(seconds % 60);
        return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
    }

    // Actualizare timer video fundal
    const videoEl = document.getElementById('bg-video');
    videoEl.addEventListener('timeupdate', () => {
        const current = formatTime(videoEl.currentTime);
        const duration = formatTime(videoEl.duration);
        document.getElementById('video-timer').innerText = `${current} / ${duration}`;
    });

    // --- SALVARE ȘI ÎNCĂRCARE DIN INDEXEDDB & LOCALSTORAGE ---
    const DB_NAME = "RIStudioDB", STORE_NAME = "filesStore";
    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = e => { e.target.result.createObjectStore(STORE_NAME); };
            request.onsuccess = e => resolve(e.target.result);
            request.onerror = e => reject(e.target.error);
        });
    }

    async function saveFileToIDB(key, file) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).put(file, key);
            tx.oncomplete = () => resolve();
            tx.onerror = e => reject(e.target.error);
        });
    }

    async function getFileFromIDB(key) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, "readonly");
            const req = tx.objectStore(STORE_NAME).get(key);
            req.onsuccess = e => resolve(e.target.result);
            req.onerror = e => reject(e.target.error);
        });
    }

    function saveState() {
        localStorage.setItem('ri_studio_state', JSON.stringify(state));
    }

    async function loadSavedState() {
        const saved = localStorage.getItem('ri_studio_state');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                state = {...state, ...parsed};
            } catch(e) {}
        }

        document.getElementById('val-slide').innerText = state.slideTime;
        document.getElementById('range-slide').value = state.slideTime;
        document.getElementById('range-cam-scale').value = state.camScale;
        document.getElementById('range-logo-scale').value = state.logoScale;
        document.getElementById('range-text-scale').value = state.textScale;
        document.getElementById('input-text-color').value = state.textColor;
        document.getElementById('input-text-val').value = state.textContent;

        const textEl = document.getElementById('draggable-text');
        textEl.innerText = state.textContent;
        textEl.style.color = state.textColor;
        textEl.style.transform = `scale(${state.textScale})`;

        // Stare microfon
        const micBtn = document.getElementById('btn-mic-toggle');
        if (state.isMicActive) {
            micBtn.innerText = "MICROFON: ON";
            micBtn.classList.add('active');
        } else {
            micBtn.innerText = "MICROFON: OFF";
            micBtn.classList.remove('active');
        }

        updateTransforms();

        ['webcam-layer', 'circle-group', 'draggable-text'].forEach(id => {
            if (state.positions && state.positions[id]) {
                const el = document.getElementById(id);
                el.style.top = state.positions[id].top || '';
                el.style.left = state.positions[id].left || '';
                el.style.bottom = state.positions[id].bottom || '';
            }
        });

        const savedVideo = await getFileFromIDB('bg_video');
        if (savedVideo) {
            videoEl.src = URL.createObjectURL(savedVideo);
            state.isVideoActive = true;
            videoEl.style.display = 'block';
            videoEl.play().catch(e => console.log("Auto-play blocked:", e));
            document.getElementById('btn-vid-toggle').innerText = "VIDEO: ON";
            document.getElementById('btn-vid-toggle').classList.add('active');
        }

        const savedLogo = await getFileFromIDB('logo_img');
        if (savedLogo) {
            const innerImg = document.getElementById('inner-img');
            innerImg.src = URL.createObjectURL(savedLogo);
            if(state.isLogoVisible) innerImg.style.display = 'block';
        }

        const savedSlides = await getFileFromIDB('slides_arr');
        if (savedSlides && savedSlides.length > 0) {
            slideshow.files = savedSlides.map(f => URL.createObjectURL(f));
            document.getElementById('slide-1').src = slideshow.files[0];
            document.getElementById('slide-1').classList.add('slide-active');
        }
    }

    async function loadVideo(i) {
        if(i.files[0]) {
            const file = i.files[0];
            await saveFileToIDB('bg_video', file);
            videoEl.src = URL.createObjectURL(file);
            state.isVideoActive = true;
            videoEl.style.display = 'block';
            videoEl.play().catch(e => console.log("Auto-play blocked:", e));
            document.getElementById('btn-vid-toggle').innerText = "VIDEO: ON";
            document.getElementById('btn-vid-toggle').classList.add('active');
            if(state.isSlideshowActive) toggleSlideshow();
            saveState();
        }
    }

    function toggleVideo() {
        state.isVideoActive = !state.isVideoActive;
        videoEl.style.display = state.isVideoActive ? 'block' : 'none';
        if(state.isVideoActive) { videoEl.play(); if(state.isSlideshowActive) toggleSlideshow(); }
        else videoEl.pause();
        document.getElementById('btn-vid-toggle').innerText = state.isVideoActive ? "VIDEO: ON" : "VIDEO: OFF";
        document.getElementById('btn-vid-toggle').classList.toggle('active', state.isVideoActive);
        saveState();
    }

    function toggleMute() {
        videoEl.muted = !videoEl.muted;
        document.getElementById('btn-vid-mute').innerText = videoEl.muted ? "🔇 MUTE" : "🔊 SUNET ON";
    }

    function toggleMicSource() {
        state.isMicActive = !state.isMicActive;
        const micBtn = document.getElementById('btn-mic-toggle');
        micBtn.innerText = state.isMicActive ? "MICROFON: ON" : "MICROFON: OFF";
        micBtn.classList.toggle('active', state.isMicActive);
        saveState();
    }

    function setTextScale(v) { 
        state.textScale = v;
        document.getElementById('draggable-text').style.transform = `scale(${v})`; 
        saveState();
    }
    
    function setTextColor(v) {
        state.textColor = v;
        document.getElementById('draggable-text').style.color = v;
        saveState();
    }

    function updateTextContent(v) {
        state.textContent = v;
        document.getElementById('draggable-text').innerText = v;
        saveState();
    }
    
    function setCamScale(v) { 
        state.camScale = v; 
        updateTransforms(); 
        saveState();
    }
    function setLogoScale(v) { 
        state.logoScale = v; 
        updateTransforms(); 
        saveState();
    }

    function updateTransforms() {
        const webcam = document.getElementById('webcam-layer');
        const logo = document.getElementById('circle-group');
        webcam.style.transform = `scale(${state.camScale})`;
        logo.style.transform = `scale(${state.logoScale})`;
    }

    function toggleElement(elementId, btnId, name) {
        const el = document.getElementById(elementId);
        const btn = document.getElementById(btnId);
        if (el.style.display === 'none') {
            el.style.display = (elementId === 'webcam-layer' && ai.stream) ? 'block' : (elementId !== 'webcam-layer' ? 'flex' : 'none');
            btn.classList.remove('hidden-state');
            btn.innerText = `HIDE ${name}: OFF`;
        } else {
            el.style.display = 'none';
            btn.classList.add('hidden-state');
            btn.innerText = `HIDE ${name}: ON`;
        }
    }

    function toggleLogoVisibility() {
        state.isLogoVisible = !state.isLogoVisible;
        const innerImg = document.getElementById('inner-img');
        const btn = document.getElementById('btn-logo-vis');
        if(state.isLogoVisible && innerImg.src) {
            innerImg.style.display = 'block';
        } else {
            innerImg.style.display = 'none';
        }
        btn.innerText = state.isLogoVisible ? "LOGO VIZIBIL: ON" : "LOGO VIZIBIL: OFF";
        btn.classList.toggle('active', state.isLogoVisible);
        saveState();
    }

    function updateSlideTime(v) { 
        state.slideTime = v; 
        document.getElementById('val-slide').innerText = v; 
        if (state.isSlideshowActive) restartSlideshow(); 
        saveState();
    }

    async function loadSlides(i) {
        const filesArr = Array.from(i.files);
        if(filesArr.length > 0) {
            await saveFileToIDB('slides_arr', filesArr);
            slideshow.files = filesArr.map(f => URL.createObjectURL(f));
            document.getElementById('slide-1').src = slideshow.files[0];
            document.getElementById('slide-1').classList.add('slide-active');
            saveState();
        }
    }

    function changeSlide() {
        if (!state.isSlideshowActive || slideshow.files.length === 0) return;
        slideshow.idx = (slideshow.idx + 1) % slideshow.files.length;
        const oldLayer = document.getElementById(`slide-${slideshow.currentLayer}`);
        slideshow.currentLayer = slideshow.currentLayer === 1 ? 2 : 1;
        const newLayer = document.getElementById(`slide-${slideshow.currentLayer}`);
        newLayer.src = slideshow.files[slideshow.idx];
        newLayer.classList.add('slide-active');
        oldLayer.classList.remove('slide-active');
    }

    function toggleSlideshow() {
        state.isSlideshowActive = !state.isSlideshowActive;
        if(state.isSlideshowActive && state.isVideoActive) toggleVideo();
        document.getElementById('btn-slide').classList.toggle('active', state.isSlideshowActive);
        document.getElementById('btn-slide').innerText = state.isSlideshowActive ? "STOP SLIDESHOW" : "START SLIDESHOW";
        if(state.isSlideshowActive) restartSlideshow();
        else { clearInterval(slideshow.int); document.querySelectorAll('.slide-layer').forEach(l => l.classList.remove('slide-active')); }
    }

    function restartSlideshow() { clearInterval(slideshow.int); changeSlide(); slideshow.int = setInterval(changeSlide, state.slideTime * 1000); }

    async function initCam() {
        try {
            ai.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
            document.getElementById('hidden-video').srcObject = ai.stream;
            document.getElementById('webcam-layer').style.display = 'block';
            setupAI();
        } catch (err) {
            alert("Nu s-a putut accesa camera. Verifică permisiunile.");
        }
    }

    function setupAI() {
        ai.selfie = new SelfieSegmentation({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`});
        ai.selfie.setOptions({ modelSelection: 1 });
        ai.selfie.onResults(res => {
            const c = document.getElementById('ai-canvas'), ctx = c.getContext('2d');
            c.width = res.image.width; c.height = res.image.height;
            ctx.clearRect(0,0,c.width,c.height);
            if(state.isAI) { ctx.globalCompositeOperation = 'copy'; ctx.drawImage(res.segmentationMask, 0, 0, c.width, c.height); ctx.globalCompositeOperation = 'source-in'; }
            ctx.drawImage(res.image, 0, 0, c.width, c.height);
        });
        const predict = async () => { 
            if (document.getElementById('hidden-video').readyState >= 2) {
                await ai.selfie.send({image: document.getElementById('hidden-video')}); 
            }
            requestAnimationFrame(predict); 
        };
        predict();
    }

    function toggleAI() { state.isAI = !state.isAI; document.getElementById('btn-ai').classList.toggle('active'); }
    
    async function loadInnerImage(i) { 
        if(i.files[0]) { 
            const file = i.files[0];
            await saveFileToIDB('logo_img', file);
            const innerImg = document.getElementById('inner-img');
            innerImg.src = URL.createObjectURL(file); 
            if(state.isLogoVisible) {
                innerImg.style.display = 'block'; 
            }
            saveState();
        } 
    }

    async function toggleRecording() {
        if (!isRecording) {
            try {
                recordCanvas = document.createElement('canvas');
                recordCanvas.width = 300;
                recordCanvas.height = 533;
                recordCtx = recordCanvas.getContext('2d');

                const slide1 = document.getElementById('slide-1');
                const slide2 = document.getElementById('slide-2');
                const webcamLayer = document.getElementById('webcam-layer');
                const aiCanvas = document.getElementById('ai-canvas');
                const circleGroup = document.getElementById('circle-group');
                const innerImg = document.getElementById('inner-img');
                const textEl = document.getElementById('draggable-text');

                function drawRecordingFrame() {
                    if (!isRecording) return;
                    recordCtx.fillStyle = "#000";
                    recordCtx.fillRect(0, 0, recordCanvas.width, recordCanvas.height);

                    if (state.isVideoActive && videoEl.readyState >= 2) {
                        recordCtx.drawImage(videoEl, 0, 0, recordCanvas.width, recordCanvas.height);
                    } else {
                        let activeSlide = slide1.classList.contains('slide-active') ? slide1 : (slide2.classList.contains('slide-active') ? slide2 : null);
                        if (activeSlide && activeSlide.src && activeSlide.style.opacity !== '0') {
                            recordCtx.drawImage(activeSlide, 0, 0, recordCanvas.width, recordCanvas.height);
                        }
                    }

                    if (webcamLayer.style.display !== 'none' && aiCanvas.width > 0) {
                        let rectW = webcamLayer.offsetWidth * state.camScale;
                        let rectH = webcamLayer.offsetHeight * state.camScale;
                        let rectX = webcamLayer.offsetLeft;
                        let rectY = webcamLayer.offsetTop;
                        recordCtx.drawImage(aiCanvas, rectX, rectY, rectW, rectH);
                    }

                    if (circleGroup.style.display !== 'none' && state.isLogoVisible) {
                        let cSize = 180 * state.logoScale;
                        let cX = circleGroup.offsetLeft;
                        let cY = circleGroup.offsetTop;
                        
                        recordCtx.save();
                        recordCtx.beginPath();
                        recordCtx.arc(cX + cSize/2, cY + cSize/2, (100 * state.logoScale)/2, 0, Math.PI * 2);
                        recordCtx.closePath();
                        recordCtx.clip();
                        if (innerImg.src && innerImg.style.display !== 'none') {
                            recordCtx.drawImage(innerImg, cX + (cSize - 100*state.logoScale)/2, cY + (cSize - 100*state.logoScale)/2, 100*state.logoScale, 100*state.logoScale);
                        }
                        recordCtx.restore();

                        recordCtx.beginPath();
                        recordCtx.arc(cX + cSize/2, cY + cSize/2, (100 * state.logoScale)/2, 0, Math.PI * 2);
                        recordCtx.lineWidth = 3;
                        recordCtx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--main-color').trim() || '#ffaa00';
                        recordCtx.stroke();
                    }

                    if (textEl.style.display !== 'none' && textEl.innerText.trim() !== "") {
                        recordCtx.save();
                        let computedStyle = window.getComputedStyle(textEl);
                        let fontSize = parseFloat(computedStyle.fontSize) || 16;
                        recordCtx.font = `900 ${fontSize * parseFloat(textEl.style.transform.replace(/[^0-9.]/g, '') || 1)}px sans-serif`;
                        recordCtx.fillStyle = textEl.style.color || '#ffffff';
                        recordCtx.shadowColor = '#000';
                        recordCtx.shadowBlur = 8;
                        recordCtx.fillText(textEl.innerText, textEl.offsetLeft, textEl.offsetTop + fontSize);
                        recordCtx.restore();
                    }

                    recordInterval = requestAnimationFrame(drawRecordingFrame);
                }

                const canvasStream = recordCanvas.captureStream(30);
                let combinedStream = canvasStream;

                // Adăugare microfon dacă este activat din buton
                if (state.isMicActive) {
                    try {
                        const micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                        const audioTracks = micStream.getAudioTracks();
                        if (audioTracks.length > 0) combinedStream.addTrack(audioTracks[0]);
                    } catch (e) {
                        console.log("Microfonul nu a putut fi accesat:", e);
                    }
                }

                recordedChunks = [];
                // Setare prioritară pentru salvare în format MP4 (.mp4), cu fallback pe webm
                let options = { mimeType: 'video/mp4' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'video/webm;codecs=vp9,opus' };
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options = { mimeType: 'video/webm' };
                        if (!MediaRecorder.isTypeSupported(options.mimeType)) options = {};
                    }
                }

                mediaRecorder = new MediaRecorder(combinedStream, options);
                mediaRecorder.ondataavailable = event => { if (event.data && event.data.size > 0) recordedChunks.push(event.data); };
                mediaRecorder.onstop = () => {
                    const mimeTypeUsed = mediaRecorder.mimeType || 'video/mp4';
                    const fileExtension = mimeTypeUsed.includes('mp4') ? 'mp4' : 'webm';
                    const blob = new Blob(recordedChunks, { type: mimeTypeUsed });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `ri-studio-${Date.now()}.${fileExtension}`;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
                };

                isRecording = true;
                drawRecordingFrame();
                mediaRecorder.start(1000);

                document.getElementById('btn-rec').innerText = "⏹️ STOP RECORD";
                document.getElementById('btn-rec').classList.add('recording');
                document.getElementById('rec-status').innerText = "ÎNREGISTRARE...";
            } catch (err) {
                alert("Nu s-a putut porni înregistrarea.");
                isRecording = false;
            }
        } else {
            isRecording = false;
            cancelAnimationFrame(recordInterval);
            if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
            
            document.getElementById('btn-rec').innerText = "🔴 START RECORD";
            document.getElementById('btn-rec').classList.remove('recording');
            document.getElementById('rec-status').innerText = "SALVAT!";
        }
    }

    function makeDraggable(el) {
        let startX = 0, startY = 0, initialX = 0, initialY = 0;
        el.addEventListener('pointerdown', dragStart);
        function dragStart(e) {
            e.preventDefault();
            startX = e.clientX; startY = e.clientY;
            initialX = el.offsetLeft; initialY = el.offsetTop;
            document.addEventListener('pointermove', dragMove);
            document.addEventListener('pointerup', dragEnd);
        }
        function dragMove(e) {
            const dx = e.clientX - startX; const dy = e.clientY - startY;
            el.style.left = (initialX + dx) + 'px';
            el.style.top = (initialY + dy) + 'px';
            el.style.bottom = 'auto';
        }
        function dragEnd() {
            document.removeEventListener('pointermove', dragMove);
            document.removeEventListener('pointerup', dragEnd);
            state.positions[el.id] = {
                top: el.style.top,
                left: el.style.left,
                bottom: el.style.bottom
            };
            saveState();
        }
    }

    function resetAll() {
        localStorage.removeItem('ri_studio_state');
        indexedDB.deleteDatabase(DB_NAME);
        location.reload();
    }

    window.onload = async () => { 
        await loadSavedState();
        ['circle-group', 'webcam-layer', 'draggable-text'].forEach(id => {
            const element = document.getElementById(id);
            if(element) makeDraggable(element);
        }); 
    };
</script>
